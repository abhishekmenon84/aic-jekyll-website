- name: "Dr Ram Prakash Galwa"
  role: "Past President"
  photo: "/assets/images/team/Dr-Ram-Prakash-Galwa.jpg"
  bio: "Dr. Ram Prakash Galwa is the Past President and a current board member of the Association of Indo-Canadians. He is a prominent physician specializing in radiology at the Dr. Everett Chalmers Regional Hospital in Fredericton. Dr. Galwa serves as the Clinical Department Head of Medical Imaging for the Fredericton Area under Horizon Health. He holds a Clinical Assistant Professor appointment in Radiology at the Memorial University of Newfoundland. He is also a community faculty member in diagnostic radiology at Dalhousie University. Dr. Galwa earned his MBBS in Jaipur and completed his MD in Radiodiagnosis in Chandigarh, India. He completed advanced fellowships in abdominal imaging and interventional radiology at the University of Ottawa. During his presidential term, he led the association with distinction, strengthening community relations. He is a strong supporter of newcomer integration and healthcare advocacy within the local community. Dr. Galwa continues to provide guidance to the executive board while serving the healthcare needs of New Brunswickers."
