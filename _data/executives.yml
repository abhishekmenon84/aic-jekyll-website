  bio: "Banwarilal Gupta serves as the Second Vice President of the Association of Indo-Canadians in Fredericton. He is currently a Mill Finance Controller and Manufacturing Finance Leader at AV Group NB, Inc. Banwarilal is based in Nackawic, New Brunswick, where he manages mill operations and corporate finance. He has a rich professional history with the Aditya Birla Group, holding various senior financial roles. His corporate experience includes department head roles in finance, accounts, and group corporate finance. On the executive board, he leverages his strong financial background to oversee budgeting and fiscal planning. Banwarilal is passionate about community service and helping families settle in New Brunswick. He supports the organization's fundraising initiatives and corporate sponsorship outreach. He works to ensure the association remains financially sustainable and accountable to its members. He is committed to promoting cultural heritage and building bridges in the local community."
