- name: "Harmeet Kaur"
  role: "Social Secretary"
  photo: "/assets/images/team/Harmeet-Kaur.jpg"
  bio: "Harmeet Kaur is the Social Secretary of the Indo-Canadian community in Fredericton for the 2025–2027 term. She is dedicated to organizing community gatherings and cultural celebrations that bring people together. In her role, Harmeet oversees the planning and execution of major events like Diwali, Holi, and Independence Day. She collaborates with local volunteers and coordinators to design inclusive, family-friendly programming. Harmeet is passionate about preserving and sharing India's rich cultural traditions within New Brunswick. She works to build strong relationships between the Indo-Canadian association and other cultural groups. Her efforts focus on creating a vibrant, welcoming space for both newcomers and long-term residents. She plays a key role in managing event logistics, decorations, and community outreach. Harmeet is committed to promoting diversity and cross-cultural understanding in the Fredericton area. Her enthusiastic leadership helps maintain high engagement and volunteer participation in community events."
