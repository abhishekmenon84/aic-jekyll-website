- name: "Manisha Verma"
  role: "Board Of Director"
  photo: "/assets/images/team/Manisha-Verma.jpg"
  bio: "Manisha Varma is a dedicated community leader, educator, and advocate based in Fredericton, New Brunswick. She serves as a Board Director for the Association of Indo-Canadians and is the Secretary of the Multicultural Association of Fredericton (MCAF). Manisha has over 15 years of experience advancing social impact, multicultural engagement, and newcomer settlement. She served as President of the Indo-Canadian Association of Fredericton from 2018 to 2022, expanding membership by 40%. Professionally, she has worked as an Educational Assistant at the Anglophone West School District since 2015. She was a candidate for the Fredericton City Council in 2026, campaigning on housing, integration, and student well-being. Manisha actively collaborates with student unions at UNB and NBCC to assist students with housing and visa challenges. She serves as a key liaison with the Consulate General of India to support students and families in emergencies. Her outstanding community work earned her the Canada 150 Community Leadership Award in 2017. She holds a Master of Arts and a Bachelor of Arts in Literature from South Gujarat University in India."
  email: "vmanisha86@gmail.com"
  linkedin: ""
  term: "2025–2027"
  active: true

- name: "Mathuresh Singh"
  role: "Board Of Director"
  photo: "/assets/images/team/Mathuresh-Singh.jpg"
  bio: "Dr. Mathuresh Singh serves as a Board Director for the Association of Indo-Canadians in Fredericton. He is a highly respected plant pathologist and researcher who has made significant contributions to agriculture. Dr. Singh served as the Managing Director of Agricultural Certification Services (ACS) Inc. in Fredericton since 1996. He holds a Ph.D. in Plant Pathology from Govind Ballabh Pant University of Agriculture and Technology. He is an Adjunct/Assistant Professor at the University of New Brunswick (UNB), collaborating on research. His scientific expertise is focused on potato pathology, disease management, and crop certification standards. He has published numerous scientific papers and frequently speaks at national agricultural conferences. On the ICAF board, he brings senior leadership experience and academic prestige to community initiatives. Dr. Singh is committed to supporting educational programs and mentoring youth within the community. He actively participates in cultural preservation efforts and guides newcomers in their academic pursuits."
