- topic: "Healthcare"
  icon: "🏥"
  items:
    - name: "NB Medicare Card — How to Apply"
      description: "Newcomers from outside Canada may be covered from their first day in NB (no waiting period), but processing typically takes 10–12 weeks — apply as soon as possible. Those moving from another Canadian province face a 3-month wait."
      address: ""
      phone: ""
      url: "https://www2.gnb.ca/content/gnb/en/departments/health/DrugPlans/content/medicare/ApplyingforaCard.html"

    - name: "Tele-Care 811"
      description: "Free, bilingual, confidential health advice line staffed by registered nurses, available 24/7 for non-emergency health questions."
      address: "Dial 811"
      phone: "811"
      url: "https://www2.gnb.ca/content/gnb/en/departments/health/Tele-Care/content/Tele-Care_FAQ.html"

    - name: "NB Addiction and Mental Health Helpline"
      description: "Confidential, bilingual, 24/7 mental health and addictions support line with crisis intervention and referrals."
      address: "Dial 811 (after-hours) or call directly"
      phone: "1 800 667 5005"
      url: "https://socialsupportsnb.ca/en/category/help-mental-health"

    - name: "Dr. Everett Chalmers Regional Hospital"
      description: "Fredericton's main hospital — emergency department, inpatient services, and outpatient clinics."
      address: "700 Priestman Street, Fredericton, NB E3B 3B7"
      phone: "506 452 5400"
      url: "https://horizonnb.ca/facilities/dr-everett-chalmers-regional-hospital/"

    - name: "Bloodwork & Lab Tests (Specimen Collection)"
      description: "A lab requisition from your doctor or nurse practitioner is required — appointments cannot be booked without one. Book online at horizonnb.ca/laboratory or by phone. Bring your NB Medicare card or valid government-issued photo ID. Two Fredericton locations: Dr. Everett Chalmers Regional Hospital (700 Priestman St, Mon–Fri 7 am–4 pm) and Fredericton North Specimen Collection at Brookside Mall (435 Brookside Drive, Mon–Fri 8 am–4 pm, appointment only)."
      address: "700 Priestman St. or 435 Brookside Drive, Fredericton, NB"
      phone: "1 833 482 0774"
      url: "https://horizonnb.ca/services/test-and-procedures/blood-and-specimen-collection/"

    - name: "Blood Donation (Canadian Blood Services)"
      description: "Fredericton has no permanent donor centre — donations happen at mobile clinics held periodically around the city. Find an upcoming clinic and book a donation appointment online, on the GiveBlood app, or by phone."
      address: ""
      phone: "1 888 236 6283"
      url: "https://www.blood.ca/en/blood/donating-blood"

- topic: "Government ID & Documents"
  icon: "🪪"
  items:
    - name: "Social Insurance Number (SIN)"
      description: "Required to work in Canada or access government programs. Free to apply — online, by mail, or in person at a Service Canada Centre. Same-day in person if documents are in order."
      address: ""
      phone: ""
      url: "https://www.canada.ca/en/employment-social-development/services/sin/apply.html"

    - name: "NB Driver's Licence for New Residents"
      description: "New residents from a country with a reciprocal agreement (e.g. UK, Germany, Japan, South Korea) can exchange their licence directly. Others must complete a written and road test. Bring your current licence plus two documents proving your NB address."
      address: "Visit any Service New Brunswick centre"
      phone: "1 888 762 8600"
      url: "https://www.gnb.ca/en/topic/driving-transportation/driving-licensing/licences-new-residents.html"

- topic: "Indian Visa, Passport & OCI Services"
  icon: "🛂"
  items:
    - name: "BLS International — Halifax Centre (nearest to Fredericton)"
      description: "BLS International is the current, sole authorized outsourced service provider for Indian visa, passport, OCI, and Police Clearance Certificate applications in Canada, on behalf of the Indian High Commission/Consulates. The Halifax centre is the nearest walk-in location for Atlantic Canada. Reported hours vary by source (roughly Mon–Fri/Sat, 8 am–4 or 5 pm, with document submission typically only accepted until early-to-mid afternoon) — confirm current hours and your exact jurisdiction (Toronto vs. Ottawa) on the BLS website before travelling, since requirements can change."
      address: "Unit 101A, 998 Parkland Drive, Halifax, NS B3M 0A6"
      phone: "902 700 6980"
      url: "https://www.blsindia-canada.com/"

    - name: "Indian e-Visa (for visiting India)"
      description: "For tourist, business, or medical visits to India, an e-Visa can be applied for entirely online — no BLS visit needed. Apply 4–120 days before travel; your passport must be valid for at least 6 months from your arrival date in India. Fee is roughly USD $80 for Canadian citizens (plus a bank transaction charge), varying by visa type and duration."
      address: ""
      phone: ""
      url: "https://indianvisaonline.gov.in/evisa/tvoa.html"

    - name: "Indian Passport Renewal / Reissue"
      description: "Apply online via the Passport Seva Portal, then submit your original passport and documents (proof of Canadian address/status, photos, and applicable annexures) at a BLS centre — in person or by mail, depending on jurisdiction. Standard processing is about 3–4 weeks (up to 8 weeks in some cases); expedited Tatkal service is 5–10 business days. Fees start around CAD $106 for a standard 36-page booklet."
      address: ""
      phone: ""
      url: "https://www.blsindia-canada.com/toronto-jurisdiction/new-booklet-or-renewal.php"

    - name: "OCI (Overseas Citizen of India) Card"
      description: "For Canadian citizens of Indian origin. As of April 2026, OCI applications must be submitted in person at a BLS centre — biometrics are required, and postal/mail-in OCI applications are no longer accepted. You'll need your current Canadian passport (6+ months validity) and proof of Indian origin (e.g. a previous Indian passport or birth certificate)."
      address: ""
      phone: ""
      url: "https://www.blsindia-canada.com/toronto-jurisdiction/ocihome.php"

