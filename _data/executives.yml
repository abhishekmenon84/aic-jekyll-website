- name: "Dr. Rakesh Mishra"
  role: "Board Of Director"
  photo: "/assets/images/team/Rakesh-Mishra.jpg"
  bio: "Dr. Rakesh Mishra is a Board Director for the Association of Indo-Canadians in Fredericton. He is an Adjunct Professor in the Department of Geodesy and Geomatics Engineering at the University of New Brunswick (UNB). Dr. Mishra is a recognized expert in AI, remote sensing, computer vision, and satellite data analytics. He serves as the Chief Technology Officer (CTO) at SceneSharp Technologies Inc. in Fredericton. He is also the Head of Research for Remote Sensing and AI at the Northern Hardwoods Research Institute. His research specializes in multi-sensor data fusion and machine learning algorithms for environmental monitoring. Rakesh has led key projects involving wildfire intelligence and precision forest inventories using LiDAR data. On the ICAF board, he actively advocates for advancing AI and technology initiatives within the community. He is dedicated to mentoring students and professionals in STEM fields in New Brunswick. Dr. Mishra helps organize community events and supports newcomer integration through professional networking."
