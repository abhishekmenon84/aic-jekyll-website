- name: "Abhishek Menon"
  role: "President"
  photo: "/assets/images/team/Abhishek-Menon.jpg"
  bio: "Mr. Abhishek Menon is the President of the Association of Indo-Canadians in Fredericton for the 2025–2027 term. He is a licensed real estate salesperson and professional REALTOR® with RE/MAX East Coast Elite Realty in Fredericton. In addition to his real estate career, Abhishek is an active software and mobile application developer. He is the founder and developer of iHomeMap, a utility app that utilizes LiDAR technology to scan rooms and generate floor plans. He also created iFlowRead, a productivity application featuring a teleprompter, voice scrolling, and eye-tracking capabilities. Abhishek is deeply committed to community building and fostering multicultural connection in New Brunswick. Under his leadership, the Association of Indo-Canadians aims to enhance integration and support systems for newcomers. He leverages his professional and technological skills to streamline community operations and communication. Abhishek works closely with local organizations to create welcoming networks for new families. He continues to reside and work in Fredericton, balancing professional success with active community service."
